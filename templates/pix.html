<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pagamento PIX - Hanna Acessórios</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Animação suave para a tela de sucesso */
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .sucesso-icon { font-size: 80px; margin: 0; }
        
        /* O spinner que fica rodando enquanto aguarda o PIX */
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid var(--primary);
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="login-container">
    <div class="login-card" style="max-width: 450px;">
        
        <div id="tela-espera">
            <h2 style="color: var(--primary);">Finalizar com PIX</h2>
            <p style="color: var(--gray); font-size: 0.9em; margin-bottom: 20px;">Você está comprando: <b>{{ produto[0] }}</b></p>
            
            <h1 style="color: var(--dark); margin: 10px 0;">R$ {{ produto[1] }}</h1>
            
            <div style="background: white; padding: 15px; border-radius: 15px; border: 2px dashed #ddd; display: inline-block; margin: 15px 0;">
                <img src="data:image/png;base64,{{ qr_image }}" alt="QR Code PIX" style="width: 200px; height: 200px;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                <input type="text" id="codigoPix" value="{{ copia_cola }}" readonly style="background: #f9f9f9; color: var(--gray); font-size: 0.8em; text-align: center; border: 1px solid #eee; padding: 10px; border-radius: 8px;">
                <button id="btnCopiar" onclick="copiarPix()" class="btn btn-dark" style="width: 100%;">📋 Copiar Código PIX</button>
            </div>
            
            <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee;">
                <p style="font-size: 0.85em; color: var(--gray); display: flex; align-items: center; justify-content: center;">
                    <span class="loader"></span> Aguardando confirmação do pagamento...
                </p>
            </div>
        </div>

        <div id="tela-sucesso" style="display: none;" class="fade-in">
            <p class="sucesso-icon">✅</p>
            <h2 style="color: var(--secondary); margin-bottom: 5px;">Pagamento Confirmado!</h2>
            <p style="color: var(--gray); font-size: 0.95em; margin-bottom: 30px;">
                Seu pedido do <b>{{ produto[0] }}</b> foi recebido com sucesso.
            </p>
            
            <a href="https://wa.me/5586999999999?text=Olá! Acabei de fazer o pagamento do {{ produto[0] }} no site!" 
               target="_blank" class="btn btn-secondary" style="display: block; width: 100%; box-sizing: border-box; margin-bottom: 10px;">
                Falar com a Hanna no Whats
            </a>
            <a href="/" class="btn btn-dark" style="display: block; width: 100%; box-sizing: border-box;">Voltar para a Loja</a>
        </div>

    </div>

    <script>
        // Função para Copiar o Código
        function copiarPix() {
            var copiaCola = document.getElementById("codigoPix");
            copiaCola.select();
            copiaCola.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copiaCola.value);
            
            var btn = document.getElementById("btnCopiar");
            btn.innerText = "✓ Código Copiado!";
            btn.style.backgroundColor = "var(--secondary)";
        }

        // Variável que veio do Python com o ID da cobrança
        const asaasId = "{{ asaas_id }}";

        // Função que pergunta ao Python "Já pagou?"
        function verificarPagamento() {
            fetch(`/verificar_status/${asaasId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'PAGO') {
                        // Esconde o QR Code e mostra o Sucesso
                        document.getElementById('tela-espera').style.display = 'none';
                        document.getElementById('tela-sucesso').style.display = 'block';
                    } else {
                        // Se não pagou ainda, tenta de novo em 3 segundos
                        setTimeout(verificarPagamento, 3000);
                    }
                })
                .catch(error => {
                    console.error("Erro ao verificar status:", error);
                    setTimeout(verificarPagamento, 5000); // Em caso de erro, tenta em 5s
                });
        }

        // Inicia a verificação 3 segundos após a página carregar
        setTimeout(verificarPagamento, 3000);
    </script>
</body>
</html>
